org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.defaults.buildfeatures.buildconfig=true
# Kotlin 2.3.20's incremental cache manager double-registers its .tab storages
# and throws "Storage ... is already registered" when closing them, which fails
# the plugin modules' compileDebugKotlin. The modules are small, so compiling
# them non-incrementally costs little.
kotlin.incremental=false
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
